spring.application.name=GATEWAY-Service

server.port = 8082
eureka.client.service-url.defaultzone = http://localhost:8761/eureka

spring.cloud.gateway.server.webmvc.routes[0].id = servicio-1
spring.cloud.gateway.server.webmvc.routes[0].uri = lb://Saludo-Service
spring.cloud.gateway.server.webmvc.routes[0].predicates = Path=/api/saludo/**

spring.cloud.gateway.server.webmvc.routes[1].id = servicio-2
spring.cloud.gateway.server.webmvc.routes[1].uri = lb://Rest-Employee
spring.cloud.gateway.server.webmvc.routes[1].predicates = Path=/api/employee/**

